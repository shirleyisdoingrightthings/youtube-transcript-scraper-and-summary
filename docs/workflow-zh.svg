<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflow-zh-title workflow-zh-desc" id="workflow-zh-root">
        <title id="workflow-zh-title">YouTube 视频深度转写工作流架构</title>
        <desc id="workflow-zh-desc">从播客雷达发现选题与字幕完整度闸门采集，经三模式起草、图解引擎、对照核校机检与三角色 Council 终审，最终幂等同步至 Notion 并通过评论棘轮进化规则的端到端架构。</desc>
        <defs>
      <style>#workflow-zh-root { --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-soft:   #5a6580;
      --color-accent: #bf4520;
      --color-link:   #2e5aa8;
      --font-sans:    'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif;
      --font-mono:    'Geist Mono', ui-monospace, Menlo, monospace; }
      #workflow-zh-root { font-family: var(--font-sans); color: var(--color-ink); }
      #workflow-zh-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#workflow-zh-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="workflow-zh-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="workflow-zh-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="workflow-zh-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <!-- Clean editorial paper background -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ZONES (3 flat zones, painted before arrows and nodes) -->
        <!-- Zone 1: Discovery & Ingest -->
        <rect x="24" y="36" width="232" height="304" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="40" y="40" width="96" height="16" rx="2" fill="#f5f5f5"/>
        <text x="88" y="52" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">发现与采集</text>

        <!-- Zone 2: Drafting & QA -->
        <rect x="284" y="36" width="420" height="304" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="300" y="40" width="96" height="16" rx="2" fill="#f5f5f5"/>
        <text x="348" y="52" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">编排与质检</text>

        <!-- Zone 3: Publish & Evolve -->
        <rect x="732" y="36" width="200" height="304" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="748" y="40" width="96" height="16" rx="2" fill="#f5f5f5"/>
        <text x="796" y="52" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">发布与进化</text>

        <!-- ARROWS (all orthogonal, painted before nodes) -->
        <!-- N1 -> N2: optional radar pick -->
        <line x1="140" y1="168" x2="140" y2="228" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#workflow-zh-arrow)"/>
        <rect x="148" y="192" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="164" y="201" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">URL</text>

        <!-- N2 -> N3: verified transcript JSON -->
        <line x1="236" y1="272" x2="304" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workflow-zh-arrow)"/>
        <rect x="248" y="252" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="270" y="261" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">JSON</text>

        <!-- N6 -> N3: optional diagram figures -->
        <line x1="392" y1="168" x2="392" y2="228" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#workflow-zh-arrow)"/>
        <rect x="400" y="192" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="426" y="201" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SVG/PNG</text>

        <!-- N3 -> N4: focal QA entry -->
        <line x1="480" y1="272" x2="508" y2="272" stroke="#bf4520" stroke-width="1.2" marker-end="url(#workflow-zh-arrow-accent)"/>

        <!-- N4 -> N5: checked draft to Council -->
        <line x1="596" y1="228" x2="596" y2="168" stroke="#bf4520" stroke-width="1.2" marker-end="url(#workflow-zh-arrow-accent)"/>
        <rect x="604" y="192" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="632" y="201" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CHECKED</text>

        <!-- N5 -> N7: publish via Notion API -->
        <line x1="684" y1="124" x2="748" y2="124" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#workflow-zh-arrow-link)"/>
        <rect x="696" y="104" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="716" y="113" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">API</text>

        <!-- N7 -> N8: Notion comments to Ratchet -->
        <line x1="832" y1="168" x2="832" y2="228" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#workflow-zh-arrow)"/>
        <rect x="840" y="192" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="870" y="201" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">COMMENTS</text>

        <!-- N8 -> N3: Ratchet rules feedback loop below zones -->
        <path d="M 832,316 V 356 Q 832,364 824,364 H 400 Q 392,364 392,356 V 316" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#workflow-zh-arrow)"/>
        <rect x="584" y="344" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="612" y="353" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RULES</text>

        <!-- NODES (8 nodes total, on 4px grid) -->
        <!-- N1: Podcast Radar (input) -->
        <rect x="44" y="80" width="192" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="44" y="80" width="192" height="88" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="52" y="88" width="44" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.45"/>
        <text x="74" y="97" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
        <text x="140" y="128" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">日常选题播客雷达</text>
        <text x="140" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">radar.py · 20 RSS</text>

        <!-- N2: Transcript Gate (backend) -->
        <rect x="44" y="228" width="192" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="44" y="228" width="192" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="52" y="236" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="72" y="245" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
        <text x="140" y="276" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">双源字幕抓取闸门</text>
        <text x="140" y="296" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">fetch_transcript · &gt;=90%</text>

        <!-- N6: Diagram Design (optional) -->
        <rect x="304" y="80" width="176" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="304" y="80" width="176" height="88" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.25"/>
        <rect x="312" y="88" width="52" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.45"/>
        <text x="338" y="97" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">OPTIONAL</text>
        <text x="392" y="128" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">图解与配图引擎</text>
        <text x="392" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">diagram-design · 52 types</text>

        <!-- N3: Mode Router & Drafting (backend) -->
        <rect x="304" y="228" width="176" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="304" y="228" width="176" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="312" y="236" width="48" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="336" y="245" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DRAFT</text>
        <text x="392" y="276" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">三模式路由与起草</text>
        <text x="392" y="296" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Mode A/B/C · split_stitch</text>

        <!-- N4: Fact-Check & Linter (FOCAL #1) -->
        <rect x="508" y="228" width="176" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="508" y="228" width="176" height="88" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <rect x="516" y="236" width="44" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="538" y="245" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">VERIFY</text>
        <text x="596" y="276" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">对照核校与静态机检</text>
        <text x="596" y="296" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">check_mode_b · glossary</text>

        <!-- N5: Agent Council QA (FOCAL #2) -->
        <rect x="508" y="80" width="176" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="508" y="80" width="176" height="88" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <rect x="516" y="88" width="52" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="542" y="97" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">COUNCIL</text>
        <text x="596" y="128" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">三角色审稿终审</text>
        <text x="596" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Prog + Cons -&gt; Judge</text>

        <!-- N7: Notion Publish & Sync (external) -->
        <rect x="748" y="80" width="168" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="748" y="80" width="168" height="88" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="756" y="88" width="48" height="12" rx="2" fill="none" stroke="#2e5aa8" stroke-width="0.8" stroke-opacity="0.45"/>
        <text x="780" y="97" fill="#2e5aa8" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">NOTION</text>
        <text x="832" y="128" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">Notion 协同发布</text>
        <text x="832" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">upload · read · comments</text>

        <!-- N8: Ratchet Evolution (store) -->
        <rect x="748" y="228" width="168" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="748" y="228" width="168" height="88" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="756" y="236" width="48" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.45"/>
        <text x="780" y="245" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">EVOLVE</text>
        <text x="832" y="276" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">Ratchet 棘轮进化</text>
        <text x="832" y="296" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">skills/*.md · glossary</text>

        <!-- LEGEND (horizontal bottom strip) -->
        <line x1="24" y1="392" x2="932" y2="392" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="24" y="424" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">图例</text>

        <line x1="88" y1="420" x2="120" y2="420" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workflow-zh-arrow)"/>
        <text x="132" y="424" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">主流程传递</text>

        <rect x="240" y="412" width="16" height="16" rx="3" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="268" y="424" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">核心质量闸门（核校与审稿）</text>

        <line x1="476" y1="420" x2="508" y2="420" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#workflow-zh-arrow-link)"/>
        <text x="520" y="424" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">Notion API 同步</text>

        <line x1="664" y1="420" x2="696" y2="420" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#workflow-zh-arrow)"/>
        <text x="708" y="424" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">按需触发 / 规则回流</text>
      </svg>
